<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="./css/main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>

    <div id="cart" class="cart rota"></div>

    <header class="topo">
        <input id="camp" class="searchCamp" type="text" required>
        <label for="camp">
            Buscar produtos...
        </label>
        <button class="close">
            X
        </button>
    </header>

    <main id="home" class="main-container rota active">
        <section>
            <div class="rootList"></div>
        </section>
    </main>

    <div class="fundo-loader"></div>

    <!-- From Uiverse.io by anand_4957 -->
    <div class="loader-wrapper">
        <div class="blur">
            <div class="loader">
                <div class="background"></div>
            </div>
        </div>
        <div class="loader">
            <div class="background"></div>
        </div>
    </div>

    <section class="bottom-bar">
        <div class="box-buttons">
            <button class="btn" onclick="changeRoute('home', this)">
                Home
            </button>
            <button class="btn" onclick="changeRoute('cart', this)">
                Carrinho
            </button>
        </div>
    </section>


</body>
<script type="module" src="./js/main.js"></script>
<script src="./js/components/bottomBar.js"></script>

</html>
